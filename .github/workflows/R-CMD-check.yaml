# Thin caller — shared logic lives in PredictiveEcology/actions (reusable workflow).
# No `secrets:` block: the only secret that workflow declares is GOOGLEDRIVE_AUTH,
# which this package does not use.
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

name: R-CMD-check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    uses: PredictiveEcology/actions/.github/workflows/R-CMD-check.yaml@main
    with:
      # The shared base already covers 5 of the 6 legs this package ran before the
      # migration, and adds windows devel/oldrel-1 plus an ubuntu nosuggests leg.
      # ubuntu oldrel-2 is the only one it does not, so it is the only extra.
      extra-config: '[{"config":{"os":"ubuntu-latest","nosuggests":false,"r":"oldrel-2"}}]'
