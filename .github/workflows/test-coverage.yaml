# Thin caller — shared logic lives in PredictiveEcology/actions (reusable workflow).
# CODECOV_TOKEN is named rather than inherited: Codecov rejects tokenless uploads.
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

name: test-coverage

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-coverage:
    uses: PredictiveEcology/actions/.github/workflows/test-coverage.yaml@main
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
